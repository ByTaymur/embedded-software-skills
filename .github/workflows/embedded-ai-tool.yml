name: Embedded AI Tool

on:
  push:
    paths: ['skills/embedded-ai-tool/**', '.github/workflows/embedded-ai-tool.yml', 'LICENSE']
  pull_request:
    paths: ['skills/embedded-ai-tool/**', '.github/workflows/embedded-ai-tool.yml', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: skills/embedded-ai-tool
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install offline Tcl test dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y openocd
      - run: python -m pip install -e ".[dev]"
      - run: python -m unittest discover -s tests -v
      - run: python -m ruff check scripts tests
      - run: python -m build
